version = "1.0"

[metadata]
author_name = "Jumppad Labs"
author_email = "team@jumppad.dev"
difficulty_explanation = "A probe, not a workflow: the agent starts one background child that sleeps for fifteen minutes and ends its turn, and the verifier reports whether the child outlived ten minutes or was stopped, and whether its completion notice started a new turn"
category = "agent-harness"
tags = ["harbor", "probe", "child-agents", "background"]

[agent]
# The child sleeps for fifteen minutes. The allowance leaves room for the
# agent's setup, the orchestrator's turns either side of it and the write of
# /app/probe.txt once the completion notice arrives.
timeout_sec = 1800.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
