version = "1.0"

[metadata]
author_name = "Jumppad Labs"
author_email = "team@jumppad.dev"
difficulty_explanation = "Starts the agent in a project already initialised for it, so Spektacular's standing rules in AGENTS.md are its real project instructions, then checks it finds code through the repo registry, reads a spec only through the CLI, and offers rather than starts a spec"
category = "agent-instructions"
tags = ["spektacular", "standing-rules", "agents-md", "cli"]

[agent]
# Three short ad-hoc requests and no workflow. A run that needs more than
# this has wandered into a workflow the instruction never asked for, which
# the verifier will flag anyway.
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[artifacts]]
source = "/app/.spektacular"
destination = "spektacular"
